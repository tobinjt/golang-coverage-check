# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# managed-by-populate-pre-commit start: header
# Install all the hook types I use rather than just pre-commit.
default_install_hook_types: [pre-commit, pre-push, commit-msg]

# https://prek.j178.dev/benchmark/?h=priority#3-priority
priorities:
    generator: 10
    formatter: 20
    formatter-late: 25
    linter: 30
    tests: 40
    coverage: 50
# managed-by-populate-pre-commit end: header

repos:
  # managed-by-populate-pre-commit start: actionlint.yaml
  - repo: local
    hooks:
    - id: actionlint
      name: Run `actionlint`
      priority: linter
      language: system
      types:
      - yaml
      exclude: dependabot.yml|actionlint.yaml$
      files: ^python/workflows/|^.github/workflows/
      entry: actionlint
  # managed-by-populate-pre-commit end: actionlint.yaml
  # managed-by-populate-pre-commit start: always_enabled.yaml
  - repo: meta
    hooks:
    - id: check-hooks-apply
      priority: linter
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
    - id: conventional-pre-commit
      priority: linter
      stages:
      - commit-msg
      args:
      - --verbose
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-case-conflict
      priority: linter
    - id: check-executables-have-shebangs
      priority: linter
    - id: check-illegal-windows-names
      priority: linter
    - id: check-merge-conflict
      priority: linter
    - id: check-vcs-permalinks
      priority: linter
    - id: check-yaml
      priority: linter
    - id: destroyed-symlinks
      priority: linter
    - id: fix-byte-order-marker
      priority: linter
    - id: mixed-line-ending
      priority: linter
  - repo: local
    hooks:
    - id: make_github_workflows
      name: Run `make_github_workflows`
      priority: generator
      language: system
      always_run: true
      pass_filenames: false
      entry: env ./.github/dependabot.yml
  - repo: local
    hooks:
    - id: populate_pre_commit
      name: Run `populate_pre_commit`
      priority: generator
      language: system
      always_run: true
      pass_filenames: false
      entry: env ./.pre-commit-config.yaml
  - repo: local
    hooks:
    - id: spellcheck
      stages:
      - commit-msg
      name: Check spelling
      priority: linter
      language: system
      verbose: true
      entry: spell-check-wrapper
  # managed-by-populate-pre-commit end: always_enabled.yaml
  # managed-by-populate-pre-commit start: golang.yaml
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
    - id: go-build
      priority: linter
    - id: go-imports
      priority: formatter
    - id: go-unit-tests
      priority: tests
    - id: go-vet
      priority: linter
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
    - id: golangci-lint
      priority: linter
  - repo: https://github.com/tobinjt/golang-coverage-check
    rev: v1.0
    hooks:
    - id: golang-coverage-check
      priority: coverage
  # managed-by-populate-pre-commit end: golang.yaml
  # managed-by-populate-pre-commit start: markdown.yaml
  - repo: local
    hooks:
    - id: markdownlint
      name: Run `markdownlint`
      priority: linter
      language: system
      types:
      - markdown
      exclude: CODE_OF_CONDUCT.md
      entry: markdownlint
  - repo: local
    hooks:
    - id: mermaid-pre-commit
      name: Run `mermaid-pre-commit`
      priority: linter
      language: system
      types:
      - markdown
      entry: mermaid-pre-commit
  # managed-by-populate-pre-commit end: markdown.yaml
  # managed-by-populate-pre-commit start: mdformat.yaml
  - repo: local
    hooks:
    - id: mdformat
      name: Run `mdformat`
      priority: linter
      language: system
      types:
      - markdown
      exclude: ^(CODE_OF_CONDUCT\.md|README\.md)$
      entry: mdformat
  # managed-by-populate-pre-commit end: mdformat.yaml
  # managed-by-populate-pre-commit start: readme-toc.yaml
  - repo: https://github.com/thlorenz/doctoc
    rev: v2.5.0
    hooks:
    - id: doctoc
      priority: generator
      files: README.md
      args:
      - --notitle
      - --minlevel=2
      - --mintocitems=3
      - --github
  # managed-by-populate-pre-commit end: readme-toc.yaml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
